name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Node.js
      uses: actions/setup-node@v2
      with:
        node-version: '18'

    - name: Install dependencies
      working-directory: ./interpretator
      run: npm install

    - name: Build project
      working-directory: ./interpretator
      run: npm run build

    - name: Run tests
      working-directory: ./interpretator
      run: npm test
